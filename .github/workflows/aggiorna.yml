name: Aggiorna Autovelox Italia
on:
  schedule:
    - cron: '0 3,6 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna dati
        run: python3 aggiorna.py
      - name: Salva su GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add autovelox_italia.json
          git diff --staged --quiet || (git commit -m "Aggiornamento settimanale" && git push)
